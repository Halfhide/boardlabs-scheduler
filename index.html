<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MeppleTime: create a poll, share the link, and find the best date for your next board game night." />
    <meta name="theme-color" content="#c67139" />
    <!-- Generic share card so poll links preview nicely in messengers.
         The app itself is noindexed via X-Robots-Tag (vercel.json). -->
    <meta property="og:site_name" content="MeppleTime" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="MeppleTime" />
    <meta property="og:description" content="Vote on the date for our next board game night. One link, no accounts." />
    <meta property="og:image" content="https://app.meppletime.today/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MeppleTime" />
    <meta name="twitter:description" content="Vote on the date for our next board game night. One link, no accounts." />
    <meta name="twitter:image" content="https://app.meppletime.today/og-card.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MeppleTime</title>
    <style>
      /* Branded splash, painted straight from the app shell before
         React boots (feature 18). main.jsx fades it out on mount. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #f5ead8;
        transition: opacity 0.45s ease;
      }
      #splash .splash-word {
        font-family: 'Caprasimo', system-ui, sans-serif;
        font-size: clamp(28px, 8vw, 40px);
        line-height: 1;
      }
      #splash .splash-word .m { color: #56633f; }
      #splash .splash-word .t { color: #b2622d; }
      #splash.splash-hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: min(38vw, 170px);
        height: auto;
        filter: drop-shadow(0 10px 24px rgb(46 43 37 / 0.2));
        animation: splash-bob 1.6s ease-in-out infinite;
      }
      @keyframes splash-bob {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/favicon.svg" alt="" />
      <div class="splash-word"><span class="m">Mepple</span><span class="t">Time</span></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
