name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Vercel's function loader cannot require() ES modules; a dependency
      # that does crashes every API request in production.
      - name: Check API functions load like on Vercel
        run: npm run check:functions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Security API and migration emulator checks
        run: npm run test:security -- release-backend

      - name: Build
        run: npm run build

      # The Polish landing (landing/pl/index.html) is generated from
      # landing/index.html and committed; a landing copy change without
      # re-running the generator would silently ship a stale Polish page.
      - name: Check Polish landing is not stale
        run: |
          node scripts/generate-pl-landing.mjs
          if ! git diff --exit-code -- landing/pl/index.html; then
            echo "::error::landing/pl/index.html is stale. Run: node scripts/generate-pl-landing.mjs and commit the result."
            exit 1
          fi

      # Guide pages, sitemap.xml, llms.txt and 404.html (feature 24) are
      # generated by scripts/generate-guides.mjs from scripts/guides/ and
      # the landing CSS, and committed; catch edits that skipped it.
      - name: Check generated guide pages are not stale
        run: |
          node scripts/generate-guides.mjs
          if [ -n "$(git status --porcelain -- landing/)" ]; then
            git status --porcelain -- landing/
            echo "::error::Generated landing files are stale. Run: node scripts/generate-guides.mjs and commit the result."
            exit 1
          fi
