name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The Polish landing (landing/pl/index.html) is generated from
      # landing/index.html and committed; a landing copy change without
      # re-running the generator would silently ship a stale Polish page.
      - name: Check Polish landing is not stale
        run: |
          node scripts/generate-pl-landing.mjs
          if ! git diff --exit-code -- landing/pl/index.html; then
            echo "::error::landing/pl/index.html is stale. Run: node scripts/generate-pl-landing.mjs and commit the result."
            exit 1
          fi
